# config/ai-routing.yaml — T-019 C4. Per-jobKind ordered provider chain, user-editable
# (length >= 1, no hardcoded max). Gemini first per D-005/D-008. Parsed by
# packages/ai/src/routing-config.ts (flat `key: [a, b, c]` shape only — no nesting).
transcribe: [gemini, ollama, claude-code]
namemap: [gemini, claude-code]
summarize: [gemini, claude-code, ollama]
claims: [gemini, claude-code]
tree-summary: [gemini, claude-code]
evaluator: [gemini, claude-code]
answer: [gemini, claude-code, ollama]
ask: [gemini, claude-code]
# U1.1: embeddings. Gemini first per D-005; ollama second so the vector index can be built
# entirely locally when the corpus must not leave our infrastructure (goal.md). Providers without
# an embed() are skipped by the router rather than failing the chain, so listing one is harmless.
embedding: [gemini, ollama]
