server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: any path that isn't a real static file resolves to index.html so
  # react-router's client-side routes (e.g. a direct load of /sessions or a page refresh on
  # /brain) work instead of 404ing against nginx's default static-file-only behavior.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
