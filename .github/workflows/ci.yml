# .github/workflows/ci.yml — T-017 C9. Same sequence as ARCHITECTURE §5 "Structure holds iff".
name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false # sources/whatsapp_msg is referenced, never built here (D-003)

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Python validator deps
        run: python -m pip install --quiet jsonschema

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit tests
        run: pnpm -r test

      - name: Generated types match schema/
        run: pnpm gen:types --check

      - name: Schema fixtures validate
        run: python schema/validate.py

      - name: Structure budgets + dependency rules
        run: pnpm lint:structure

      - name: Linter negative tests
        run: pnpm test:lint
